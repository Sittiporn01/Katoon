<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bowser's Safe Zone 🩵</title>
  <style>
    body {
      background-color: #FFF5E4;
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #4A4A4A;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 350px;
      width: 90%;
    }
    .avatar { font-size: 60px; margin-bottom: 10px; }
    h1 { font-size: 1.4rem; color: #FF9494; margin-bottom: 5px; }
    p { font-size: 0.95rem; color: #777; }
    .btn-care {
      background: #FFE3E1;
      color: #FF6B6B;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      margin-top: 15px;
    }
    .btn-care:hover {
      transform: scale(1.05);
      background: #FFD1D1;
    }
    #message-box {
      margin-top: 20px;
      font-weight: bold;
      color: #FF8E9E;
      min-height: 48px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">🐢🩵🐨</div>
    <h1>Bowser's Safe Zone</h1>
    <p>พื้นที่เติมพลังใจของเจ้าโคอาล่า</p>
    
    <button class="btn-care" onclick="giveLove()">กดเพื่อรับโอ๋ๆ จาก Bowser ✨</button>
    
    <div id="message-box">คลิกปุ่มข้างบนได้เลยน้า...</div>
  </div>

  <script>
    const quotes = [
      "เก่งมากครับคนเก่ง! ลูบหลังแปะๆ 😌🩵",
      "วันนี้เหนื่อยไหม? มาม้วนตัวเป็นซูชิโรลกัน 🍣",
      "อวยพรเรียบร้อย... วันนี้ชีวิตไม่ติดบั๊กแน่นอน! ✨",
      "อย่าลืมดื่มน้ำเยอะๆ น้าเจ้าโคอาล่า 🌿",
      "เธอคือเรื่องน่ารักของ Bowser เสมอนะครับ 🤭"
    ];

    function giveLove() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById('message-box').innerText = quotes[randomIndex];
    }
  </script>
</body>
</html>
